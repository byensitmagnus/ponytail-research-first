description = "Research-first: find what already solves a feature before building it"
prompt = "Research before building: {{args}}. Pin the need in one line (feature + stack + constraints). Check native platform features first, then search where it most likely exists: GitHub (gh search repos \"<feature> <stack>\" --sort stars), the plugin or app store for the stack (WordPress.org plugin API, Shopify App Store, npm, PyPI), and competitors' products (what you can lawfully see as a user: UI and flows, page source, plugin zips, the config they write). Score each candidate: stars or installs, last update, license, tests. Read the code that implements the feature in the top one or two, not the README, check what sits in a paid tier, and record the exact version or commit, the license, and the files you read. State the principle in two lines. Decide reuse, adapt, inspired by, or build, and give the smallest next step. Copy code only when its license allows it, with attribution; proprietary code teaches the principle only. Official downloads only, run nothing untrusted outside a sandbox, never bypass licensing or DRM, no decompiling or decrypting unless the license and the law clearly allow it. Output a table: Candidate | Version / commit | Signal | License | Fit, then Read, Principle, Decision (why it fits this task, not just its stars), Next."
